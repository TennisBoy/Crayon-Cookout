name: CI

# Both suites are designed to run without cloud credentials — the backend
# fakes its repositories and the frontend mocks fetch — so CI never needs a
# secret. Keep it that way: a test that needs a key is a test that will rot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it fails on a lockfile that does
      # not match package.json, which is exactly the breakage that would
      # otherwise only surface inside the Docker build.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a malformed compose file before it reaches the VM. Needs a
      # .env because compose interpolates variables while validating.
      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose file is valid"

      # Production runs deploy/docker-compose.prod.yml, not the file above. It
      # drifted once and cost a 503 on a real payment; validating it here means
      # the file that actually ships is the file that gets checked.
      - name: Validate the production compose file
        run: |
          docker compose -f deploy/docker-compose.prod.yml config --quiet
          echo "production compose file is valid"

      - name: Check shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f" && echo "ok $f"; done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh

      # The images are what actually ship. Building them here means a broken
      # Dockerfile fails in CI rather than halfway through a deploy.
      - name: Build backend image
        run: docker build -t crayon-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t crayon-frontend:ci ./frontend

      - name: Smoke-test the API image
        run: |
          docker run -d --name api -p 8000:8000 crayon-backend:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/api/health > /dev/null; then
              echo "API is healthy with no configuration — as intended"
              curl -s localhost:8000/api/health/ready
              docker rm -f api
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker logs api
          docker rm -f api
          exit 1
