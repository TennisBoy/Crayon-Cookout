# Crayon Cookout — production stack
#
# Deployment root. This directory holds no source: images are built in CI and
# pulled by tag. Override BACKEND_IMAGE / FRONTEND_IMAGE in .env to pin a
# release; the defaults are whatever was last built on this machine.
#
# Ports bind to 127.0.0.1 only. Nothing is reachable from the internet
# directly; Cloudflare Tunnel connects outbound to these loopback ports.

services:
  backend:
    image: ${BACKEND_IMAGE:-crayon-cookout-backend:latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Secrets come from .env — never baked into the image.
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-claude-sonnet-4-5}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      # The 127.0.0.1 prefix is the security boundary — drop it and the API is
      # exposed on the VM's public interface.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks: [crayon]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    image: ${FRONTEND_IMAGE:-crayon-cookout-frontend:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks: [crayon]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  crayon:
    driver: bridge
