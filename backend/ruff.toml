target-version = "py312"
line-length = 88

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "S"]
ignore = [
    "S101",  # assert — used throughout the test suite
    "B008",  # function call in default arg — FastAPI's Depends() idiom
]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded test credentials are fine
