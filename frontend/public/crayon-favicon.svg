<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crayon Cookout">
  <title>Crayon Cookout</title>
  <!-- The mark is the app logo (components/CrayonLogo.jsx): a fanned bunch of
       rainbow crayons, each a tip triangle over a barrel with a pale label
       band, rotated about its foot.

       Two deliberate departures from the logo, both for legibility once the
       icon is scaled to a tab strip:
       - Five crayons, not seven. At 16px seven barrels are under 2px each and
         the rainbow collapses into a smear.
       - Heights follow an arch rather than the logo's sin(i * 1.3) wobble,
         which droops to one side when sampled at only five points. -->
  <!-- Rounded square so the mark reads as an app icon at 16px rather than a
       thin diagonal line lost against the tab strip. Brand purple is also the
       colour missing from the crayons, so it reads as part of the rainbow. -->
  <rect width="64" height="64" rx="14" fill="#A855F7"/>
  <g transform="rotate(-12 16.5 51.6)">
    <path d="M13.3 27.6 L16.5 20.8 L19.7 27.6 L19.7 50.2 Q19.7 51.6 18.3 51.6 L14.7 51.6 Q13.3 51.6 13.3 50.2 Z" fill="#EF4444"/>
    <rect x="13.3" y="33.7" width="6.4" height="4" fill="#FFFFFF" opacity=".4"/>
  </g>
  <g transform="rotate(-6 24.2 51.6)">
    <path d="M21 22.6 L24.2 14.5 L27.4 22.6 L27.4 50.2 Q27.4 51.6 26 51.6 L22.4 51.6 Q21 51.6 21 50.2 Z" fill="#F97316"/>
    <rect x="21" y="30.1" width="6.4" height="4.8" fill="#FFFFFF" opacity=".4"/>
  </g>
  <g transform="rotate(0 31.9 51.6)">
    <path d="M28.7 20.5 L31.9 11.7 L35.1 20.5 L35.1 50.2 Q35.1 51.6 33.7 51.6 L30.1 51.6 Q28.7 51.6 28.7 50.2 Z" fill="#FACC15"/>
    <rect x="28.7" y="28.5" width="6.4" height="5.2" fill="#FFFFFF" opacity=".4"/>
  </g>
  <g transform="rotate(6 39.6 51.6)">
    <path d="M36.4 23.3 L39.6 15.4 L42.8 23.3 L42.8 50.2 Q42.8 51.6 41.4 51.6 L37.8 51.6 Q36.4 51.6 36.4 50.2 Z" fill="#22C55E"/>
    <rect x="36.4" y="30.6" width="6.4" height="4.7" fill="#FFFFFF" opacity=".4"/>
  </g>
  <g transform="rotate(12 47.3 51.6)">
    <path d="M44.1 26.9 L47.3 19.9 L50.5 26.9 L50.5 50.2 Q50.5 51.6 49.1 51.6 L45.5 51.6 Q44.1 51.6 44.1 50.2 Z" fill="#3B82F6"/>
    <rect x="44.1" y="33.2" width="6.4" height="4.1" fill="#FFFFFF" opacity=".4"/>
  </g>
</svg>
